<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>흔적 · Trace — 화면 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F1E8;
    --paper: #FAF7EE;
    --ink: #1F2A37;
    --ink-soft: #4A5568;
    --gold: #B8924F;
    --burgundy: #7A2E2E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2A3744; min-height: 100vh; }
  body {
    font-family: 'Gowun Dodum', sans-serif;
    color: var(--cream);
  }
  header {
    text-align: center;
    padding: 48px 16px 24px;
  }
  header h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 500;
    font-size: 32px;
    margin: 0;
    letter-spacing: -0.02em;
    color: var(--cream);
  }
  header h1 .dot { color: var(--gold); margin: 0 0.15em; }
  header h1 .en {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
  }
  header .tagline {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    color: var(--gold);
    margin-top: 8px;
    font-size: 16px;
  }
  header .sub {
    color: rgba(245,241,232,0.6);
    font-size: 13px;
    margin-top: 16px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
    gap: 32px;
    padding: 24px max(16px, 5vw) 80px;
    max-width: 1800px;
    margin: 0 auto;
  }
  .screen {
    display: flex; flex-direction: column; align-items: center;
  }
  .screen .label {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    color: var(--gold);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .screen .ko {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    color: var(--cream);
    margin-bottom: 16px;
  }
  iframe {
    border: none;
    width: 425px;
    height: 870px;
    background: var(--cream);
  }

  footer {
    text-align: center;
    padding: 24px;
    color: rgba(245,241,232,0.4);
    font-size: 12px;
    border-top: 1px solid rgba(245,241,232,0.1);
  }
  footer code {
    background: rgba(245,241,232,0.08);
    padding: 2px 6px;
    border-radius: 2px;
  }

  @media (max-width: 480px) {
    .gallery { padding: 16px; }
    iframe { width: 100%; height: 800px; }
  }
</style>
</head>
<body>
<header>
  <h1>흔적<span class="dot">·</span><span class="en">Trace</span></h1>
  <p class="tagline">신앙은 점수가 아닌 흔적입니다.</p>
  <p class="sub">화면 목업 — Sprint 1~6 결과를 정적 HTML 로 시각 검증</p>
</header>

<div class="gallery">
  <div class="screen">
    <div class="label">TAB 1</div>
    <div class="ko">오늘 · 일일 체크인</div>
    <iframe src="today.html" title="Today"></iframe>
  </div>
  <div class="screen">
    <div class="label">TAB 2</div>
    <div class="ko">여정 · 한 해의 결</div>
    <iframe src="journey.html" title="Journey"></iframe>
  </div>
  <div class="screen">
    <div class="label">TAB 3</div>
    <div class="ko">구역 · 동행</div>
    <iframe src="cell.html" title="Cell"></iframe>
  </div>
  <div class="screen">
    <div class="label">TAB 4</div>
    <div class="ko">나 · 메뉴</div>
    <iframe src="self.html" title="Self"></iframe>
  </div>
</div>

<footer>
  데이터는 시연용 목업입니다. 실제 앱은 <code>src/app/(tabs)/</code> 의
  React Native 코드가 동일한 디자인 토큰으로 렌더합니다.
</footer>
</body>
</html>
